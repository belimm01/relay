name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser flow
    runs-on: ubuntu-latest
    env:
      RELAY_BOOTSTRAP_API_KEY: rk_local_dev_key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise endpoint-to-replay flow
        run: |
          cleanup() { docker compose down --volumes; }
          trap cleanup EXIT
          docker compose up --build --detach
          for attempt in {1..60}; do
            if curl --fail --silent \
              --header "X-Api-Key: $RELAY_BOOTSTRAP_API_KEY" \
              http://localhost:5173/api/endpoints >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready:-}" != 1 ]; then
            docker compose logs
            exit 1
          fi
          if ! npm --prefix frontend run test:e2e; then
            docker compose logs
            exit 1
          fi

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/relay
      - run: helm template relay deploy/helm/relay > /tmp/relay.yaml
