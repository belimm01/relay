apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relay.fullname" . }}-backend
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "relay.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: RELAY_DB_URL, value: {{ .Values.database.url | quote }}}
            - {name: RELAY_DB_USER, value: {{ .Values.database.user | quote }}}
            - name: RELAY_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.passwordKey }} }
            - name: RELAY_BOOTSTRAP_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.bootstrap.existingSecret }}, key: {{ .Values.bootstrap.key }} }
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay.fullname" . }}-backend
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - {name: http, port: 8080, targetPort: http}
