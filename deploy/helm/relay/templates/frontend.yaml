apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "relay.fullname" . }}-nginx
  labels:
    {{- include "relay.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location /api/ { proxy_pass http://{{ include "relay.fullname" . }}-backend:8080; }
      location /in/ { proxy_pass http://{{ include "relay.fullname" . }}-backend:8080; }
      location /ws {
        proxy_pass http://{{ include "relay.fullname" . }}-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
      location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relay.fullname" . }}-frontend
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "relay.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
      volumes:
        - name: nginx
          configMap: {name: {{ include "relay.fullname" . }}-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
