services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    volumes:
      - relay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      RELAY_DB_URL: jdbc:postgresql://db:5432/relay
      RELAY_DB_USER: relay
      RELAY_DB_PASSWORD: relay
      RELAY_BOOTSTRAP_API_KEY: ${RELAY_BOOTSTRAP_API_KEY:-rk_local_dev_key}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  relay-db:
